name: Dashboard CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tests, build and browser smoke
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests with coverage
        run: npm run test:coverage

      - name: Local server integration tests
        run: npm run test:server

      - name: Windows PowerShell launcher integration tests
        run: npm run test:server:windows

      - name: Build release artifact
        run: npm run build

      - name: Validate release artifact
        run: npm run validate:release

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Browser smoke and accessibility tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chromium

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
