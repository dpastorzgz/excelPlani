# Technology configuration (Angular Pelayo)
# Schema: canonical (aligned with technology-rules/_template/tech-config.yml).
# guidelines[] is the single source of truth for which files load in which phases
# (see framework/config/context-routing.yml).

technology: "angular-pelayo"
display_name: "Angular Pelayo Frontend"
version: "2.0.0"

language: "typescript"
runtime_version: ">=22.0"
secondary_languages:
  - "html"
  - "scss"
  - "yaml"

testing:
  coverage_threshold: 75
  critical_coverage_threshold: 85
  framework: "Vitest 4"
  run_command: "npm test"
  coverage_command: "npm test -- --coverage"
  integration_tests_required: false
  e2e_tests_required: false

linting:
  tool: "ESLint (angular-eslint) + Prettier"
  config_file: "eslint.config.js"
  # ESLint errors and Prettier violations are both blocking (ANG5.3).
  run_command: "npm run lint && npm run format:check"
  blocking: true

deployment:
  tool: "npm"
  build_command: "npm run build"
  build_commands:
    dev: "npm run build:dev"
    acp: "npm run build:acp"
    pre: "npm run build:pre"
    production: "npm run build"
  validate_command: "npm run build && npm test && npm run lint && npm run format:check"
  release_artifact: "CI-built dist/ artifact for the target configuration (build id = commit SHA); promoted pre -> production, never rebuilt by hand"
  environments:
    - "dev"
    - "acp"
    - "pre"
    - "production"
  production_requires_approval: true
  source_maps_in_production: false

version_control:
  branch_pattern: "feature/*"
  merge_strategy: "squash"
  min_approvals: 1

commands:
  dev_server:
    description: "Start the development server with MSW mocks enabled"
    command: "npm start"
  build_production:
    description: "Production-optimized build (blocking gate ANG5.1)"
    command: "npm run build"
  build_dev:
    description: "Development-optimized build (local verification)"
    command: "npm run build:dev"
  build_acp:
    description: "Acceptance environment build (development-optimized)"
    command: "npm run build:acp"
  build_pre:
    description: "Preproduction build (production-optimized)"
    command: "npm run build:pre"
  test:
    description: "Run the Vitest suite (blocking gate ANG7.2)"
    command: "npm test"
  coverage:
    description: "Run tests with coverage report (blocking gate ANG7.3)"
    command: "npm test -- --coverage"
  lint:
    description: "Run ESLint (0 errors required — ANG5.3)"
    command: "npm run lint"
  format_check:
    description: "Verify Prettier formatting (clean required — ANG5.3)"
    command: "npm run format:check"

artifacts:
  build_log: "work-item/[project-slug]/05-build/build-log.md"
  verification_report: "work-item/[project-slug]/06-verification/verification-report.md"
  test_report: "work-item/[project-slug]/07-testing/test-report.md"
  coverage_report: "work-item/[project-slug]/07-testing/coverage/"
  release_notes: "work-item/[project-slug]/09-release/release-notes.md"
  retrospective: "work-item/[project-slug]/10-archive/retrospective.md"

guidelines:
  - file: "rules.md"
    description: "Master Angular rules (baseline, phase rules, loading table)"
    phases: [03, 04, 05, 06, 07, 09]
  - file: "context.md"
    description: "Angular background knowledge, concepts, pitfalls, glossary"
    phases: [03, 04, 05]
  - file: "GeneralGuidelines.md"
    description: "Non-overlapping TypeScript and coding standards"
    phases: [03, 04, 05, 06]
  - file: "NamingConventions.md"
    description: "Naming standards for files, symbols, templates, styles, tests"
    phases: [03, 04, 05, 06, 07, 08]
  - file: "ProjectPlanning.md"
    description: "Project planning and estimation guidance"
    phases: [03, 04]
  - file: "ComponentGuidelines.md"
    description: "Standalone component, signal API, and template rules"
    phases: [03, 04, 05, 06]
  - file: "StateManagementGuidelines.md"
    description: "Signals-first state, stores, resources, RxJS interop"
    phases: [03, 04, 05, 06]
  - file: "RxJSGuidelines.md"
    description: "Reactive stream discipline and operator rules"
    phases: [03, 04, 05, 06]
  - file: "FormsGuidelines.md"
    description: "Typed reactive forms and validation rules"
    phases: [03, 04, 05, 06]
  - file: "RoutingGuidelines.md"
    description: "Lazy loading, guards, resolvers, title strategy"
    phases: [03, 04, 05, 06]
  - file: "DataAccessGuidelines.md"
    description: "Typed HTTP layer, interceptors, MSW mock strategy"
    phases: [03, 04, 05, 06, 07]
  - file: "StylingGuidelines.md"
    description: "SCSS architecture, Material theming, design tokens"
    phases: [03, 04, 05, 06]
  - file: "AccessibilityGuidelines.md"
    description: "WCAG 2.2 AA and Angular a11y rules"
    phases: [03, 04, 05, 06, 07]
  - file: "PerformanceGuidelines.md"
    description: "Budgets, defer, lazy loading, runtime performance"
    phases: [03, 04, 05, 06, 07]
  - file: "TestingGuidelines.md"
    description: "Vitest 4, TestBed, MSW test patterns, coverage policy"
    phases: [05, 07]
  - file: "SecurityGuidelines.md"
    description: "XSS, secrets, token handling, dependency hygiene"
    phases: [03, 04, 05, 06, 08, 09]
  - file: "DeploymentGuidelines.md"
    description: "Build configs, CI, environments, rollback, release"
    phases: [03, 04, 05, 06, 08, 09]
  - file: "verification-overlay.md"
    description: "Build/test triage + ANG3.3 design cross-checks"
    phases: [03, 05, 06]
  - file: "quality-gates.md"
    description: "Blocking Angular quality gates (ANG*)"
    phases: [02, 03, 04, 05, 06, 07, 08, 09]

references:
  official_docs: "https://angular.dev"
  style_guide: "https://angular.dev/style-guide"
  material: "https://material.angular.dev"
  testing: "https://vitest.dev"
  mocks: "https://mswjs.io"
  eslint: "https://github.com/angular-eslint/angular-eslint"
  release_pipeline: "technology-rules/angular/release-pipeline.yml"
